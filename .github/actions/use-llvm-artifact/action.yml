name: Use LLVM build artifact
description: Install the LLVM package built for this runner in the current workflow run
inputs:
  target-os:
    description: LLVM package OS (ubuntu or almalinux)
    required: true
outputs:
  path:
    description: Absolute path to the unpacked LLVM installation
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: llvm-${{ inputs.target-os }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        path: ${{ runner.temp }}/llvm-artifact
    - id: install
      shell: bash
      run: |
        install_dir=$(mktemp -d "$RUNNER_TEMP/llvm.XXXXXX")
        tar -xzf "$RUNNER_TEMP"/llvm-artifact/*.tar.gz -C "$install_dir" --strip-components=1
        if [[ ! -x "$install_dir/bin/llvm-config" ]]; then
          echo "::error::LLVM artifact is missing executable bin/llvm-config"
          exit 1
        fi
        echo "LLVM_SYSPATH=$install_dir" >> "$GITHUB_ENV"
        echo "path=$install_dir" >> "$GITHUB_OUTPUT"
