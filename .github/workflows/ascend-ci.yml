name: Integration Tests
on:
  workflow_dispatch:
  pull_request:
    paths: &ci-paths
      - 'python/**'
      - 'lib/**'
      - 'include/**'
      - 'bin/**'
      - 'third_party/**'
      - 'test/**'
      - 'unittest/**'
      - 'utils/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'Makefile'
      - 'safe_compile.cmake'
      - 'version.txt'
      - '.github/workflows/ascend-ci.yml'
      - '.github/workflows/ascend-llvm-build.yml'
      - '.github/workflows/build/almalinux.Dockerfile'
      - '.github/workflows/build/install-llvm-artifact.sh'
      - '.github/workflows/integration-tests-ascend.yml'
      - '.github/workflows/ascend-runner-preparation.yml'
  merge_group:
    branches: [main, 'release/**', '**-dev']
    types: [checks_requested]
  push:
    branches: [main, 'release/**', '**-dev']
    paths: *ci-paths
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions: read-all

jobs:

  runner-preparation:
    uses: ./.github/workflows/ascend-runner-preparation.yml

  pr-llvm:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ascend-llvm-build.yml
    with:
      target-os: ubuntu

  integration-tests-ascend:
    needs: [runner-preparation, pr-llvm]
    if: ${{ !failure() && !cancelled() && needs.runner-preparation.outputs.matrix-ASCEND != '' }}
    uses: ./.github/workflows/integration-tests-ascend.yml
    with:
      matrix: ${{ needs.runner-preparation.outputs.matrix-ASCEND }}
      use-llvm-artifact: ${{ needs.pr-llvm.outputs.use-artifact == 'true' }}
