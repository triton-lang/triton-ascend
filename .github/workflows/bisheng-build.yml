name: Bisheng Package Build

on:
  workflow_dispatch:
    inputs:
      npuir_ref:
        description: "AscendNPU-IR branch/tag/commit to build (default: master)"
        required: false
        type: string
        default: ""
  push:
    paths:
      - .github/workflows/bisheng-build.yml
      - .github/workflows/build/bisheng-package/**
  pull_request:
    paths:
      - .github/workflows/bisheng-build.yml
      - .github/workflows/build/bisheng-package/**

concurrency:
  group: bisheng-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
  PIP_TRUSTED_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
  PIP_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi

jobs:
  # Clones AscendNPU-IR directly (no triton-ascend submodule), archives its
  # nested submodule sources (llvm-project, torch-mlir, shmem) at the exact
  # commits the clone records, and hands them to the build job as an artifact.
  # Runs on a GitHub-hosted runner because the self-hosted runner network
  # cannot reliably clone the large gitcode repositories ("remote transport
  # reported error"); github.com -> gitcode transfers work fine, as the
  # upstream AscendNPU-IR CI proves.
  prepare-sources:
    name: Prepare npuir sources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      npuir_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Clone AscendNPU-IR
        run: |
          git clone "https://github.com/Ascend/AscendNPU-IR.git" third_party/ascend/AscendNPU-IR
          # npuir_ref default only applies to workflow_dispatch; on push/PR
          # the context is empty, so guard explicitly.
          if [ -n "${{ inputs.npuir_ref || '' }}" ]; then
            git -C third_party/ascend/AscendNPU-IR fetch origin "${{ inputs.npuir_ref }}"
            git -C third_party/ascend/AscendNPU-IR checkout FETCH_HEAD
          fi

      - name: Compute source pin
        id: pin
        run: |
          SHA="$(git -C third_party/ascend/AscendNPU-IR rev-parse HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved npuir commit: ${SHA}"

      - name: Archive nested submodule sources
        run: |
          set -eu
          NPUIR=third_party/ascend/AscendNPU-IR
          mkdir -p sources
          git -C "$NPUIR" ls-tree HEAD third-party/ | while read -r _ _ sha path; do
            name=$(basename "$path")
            url=$(git -C "$NPUIR" config -f .gitmodules --get "submodule.$path.url")
            branch=$(git -C "$NPUIR" config -f .gitmodules --get "submodule.$path.branch" || true)
            echo "Archiving ${path} at ${sha} (${url})"
            rm -rf "/tmp/${name}"
            git init -q "/tmp/${name}"
            git -C "/tmp/${name}" remote add origin "$url"
            # gitcode allows depth-1 fetches of an exact SHA. Fall back to
            # fetching the branch tip first if the server rejects it.
            if ! git -C "/tmp/${name}" fetch --depth 1 origin "$sha"; then
              if [ -n "${branch}" ]; then
                git -C "/tmp/${name}" fetch --depth 1 origin "$branch"
              else
                git -C "/tmp/${name}" fetch --depth 1 origin HEAD
              fi
              git -C "/tmp/${name}" fetch --depth 1 origin "$sha"
            fi
            git -C "/tmp/${name}" archive --prefix="${name}/" --format=tar.gz \
              -o "$GITHUB_WORKSPACE/sources/${name}-${sha}.tar.gz" FETCH_HEAD
            echo "${path} ${sha}" >> "$GITHUB_WORKSPACE/sources/pin.txt"
          done
          ls -lh sources/

      - name: Upload source archives
        uses: actions/upload-artifact@v4
        with:
          name: npuir-sources
          path: sources/
          if-no-files-found: error

  # Builds AscendNPU-IR from the latest sources, packages the result as the
  # same makeself .run format integration-tests-ascend.yml downloads from OBS
  # today, and uploads it to obs://triton-ascend-artifacts/cann/. Mirrors the
  # upstream AscendNPU-IR CI recipe (build-tools/build.sh with templates on).
  # No NPU or buildkit needed (this job has no image-build steps; the
  # container below is a plain pull). The pods are cgroup-limited to
  # 16 CPUs / 32 GB regardless of the host nproc, so parallelism is passed
  # explicitly via -j (see BUILD_JOBS below).
  build:
    name: Build bisheng package (${{ matrix.config.arch }})
    needs: prepare-sources
    runs-on: ${{ matrix.config.runs_on }}
    # CANN 9.1.0 image (multi-arch). Note: no public bisheng compiler defines
    # CCE_PRINT_CC (neither the image's nor the OBS toolkit's); the build step
    # defines it as an empty macro before compiling. If the image's compiler
    # is missing entirely, the "Locate bisheng compiler" step falls back to
    # extracting it from the CANN 9.1.0 toolkit download (cached).
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        config:
          - {runs_on: 'linux-aarch64-cpu-16', arch: 'aarch64', target_arch: 'aarch64'}
          - {runs_on: 'linux-amd64-cpu-16', arch: 'x86_64', target_arch: 'x86'}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "false"

      - name: Add git safe directory
        run: git config --global --add safe.directory "*"

      - name: Clone AscendNPU-IR
        run: |
          # Full clone (repo is ~65MB) so any resolved commit can be checked
          # out; the nested submodules come from the prepare-sources artifact,
          # not from the network (gitcode big-repo transfers fail here).
          git clone "https://github.com/Ascend/AscendNPU-IR.git" third_party/ascend/AscendNPU-IR
          git -C third_party/ascend/AscendNPU-IR checkout "${{ needs.prepare-sources.outputs.npuir_sha }}"

      - name: Download nested submodule sources
        uses: actions/download-artifact@v4
        with:
          name: npuir-sources
          path: npuir-sources

      - name: Unpack nested submodule sources
        run: |
          set -eu
          NPUIR=third_party/ascend/AscendNPU-IR
          while read -r path sha; do
            tarball="npuir-sources/$(basename "${path}")-${sha}.tar.gz"
            test -f "${tarball}" || { echo "Missing archive: ${tarball}"; exit 1; }
            # The archives were made from the same npuir commit, so the
            # gitlinks must match; this guards against source drift.
            gitlink=$(git -C "$NPUIR" ls-tree HEAD "$path" | awk '{print $3}')
            test "${gitlink}" = "${sha}" || {
              echo "Archive sha ${sha} != gitlink ${gitlink} for ${path}"; exit 1; }
            tar xzf "${tarball}" -C "$NPUIR/third-party"
          done < npuir-sources/pin.txt
          ls "$NPUIR/third-party"

      - name: Install build tools
        run: |
          apt-get update
          # The ascend-ci image is minimal: it lacks python3 AND bash. GitHub
          # Actions falls back to sh for run steps when bash is absent, so the
          # steps before this one must stay POSIX. bash is required by
          # build-tools/build.sh and the installer scripts (shebang), and
          # python3 by pip (cmake/ninja below) and the LLVM build itself.
          apt-get install -y --no-install-recommends bash clang lld ccache python3 python3-pip
          # lld is required: linking the ~170MB static bishengir binaries with
          # GNU ld needs 6-10GB and gets OOM-killed on the 4-CPU pods.
          apt-get install -y lld-15 || true
          update-alternatives --install /usr/bin/lld lld /usr/bin/lld-15 100 || true
          # Ubuntu 22.04 ships cmake 3.22 / ninja 1.10; bishengir requires
          # cmake >= 3.28 and ninja >= 1.12.
          python3 -m pip install cmake ninja

      - name: Restore bisheng compiler cache
        id: bisheng-cache
        uses: actions/cache/restore@v4
        with:
          path: bisheng_toolkit
          key: cann-9.1.0-bisheng-${{ matrix.config.arch }}

      - name: Locate bisheng compiler
        id: bisheng
        run: |
          set -eu
          # Prefer the image's compiler (CANN 9.1.0). Note: it does NOT
          # define CCE_PRINT_CC — no public compiler does — the build step
          # defines that marker as an empty macro before building.
          BISHENG_DIR=""
          if command -v bisheng >/dev/null 2>&1; then
            BISHENG_DIR="$(dirname "$(command -v bisheng)")"
          else
            BISHENG_DIR="$(find /usr/local/Ascend -maxdepth 8 -type f -name bisheng 2>/dev/null | head -1 | xargs -r dirname)"
          fi
          if [ -n "${BISHENG_DIR}" ] && [ -x "${BISHENG_DIR}/ccec" ] && [ -x "${BISHENG_DIR}/llvm-link" ]; then
            echo "Found bisheng compiler at ${BISHENG_DIR}"
            echo "bisheng_dir=${BISHENG_DIR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fallback: extract the 9.1.0 compiler from the CANN toolkit, same
          # as the upstream AscendNPU-IR CI containers do. Cached, so only
          # the first run downloads (~1.3GB).
          if [ -x bisheng_toolkit/bisheng_compiler/bin/ccec ]; then
            echo "Using cached extracted bisheng compiler"
          else
            CANN_ARCH="${{ matrix.config.arch }}"
            curl -fLO "https://ascend-repo.obs.cn-east-2.myhuaweicloud.com/CANN/CANN%209.1.0/Ascend-cann-toolkit_9.1.0_linux-${CANN_ARCH}.run"
            bash "./Ascend-cann-toolkit_9.1.0_linux-${CANN_ARCH}.run" --noexec --extract=cann910
            bash cann910/run_package/cann-bisheng-compiler_*.run --noexec --extract=bisheng_toolkit
            rm -rf cann910
          fi
          BISHENG_DIR="$GITHUB_WORKSPACE/bisheng_toolkit/bisheng_compiler/bin"
          test -x "${BISHENG_DIR}/ccec"
          test -x "${BISHENG_DIR}/llvm-link"
          echo "bisheng_dir=${BISHENG_DIR}" >> "$GITHUB_OUTPUT"

      - name: Save bisheng compiler cache
        # Only save when the extraction actually produced a compiler
        # (hashFiles is empty when the file does not exist).
        if: steps.bisheng-cache.outputs.cache-hit != 'true' && hashFiles('bisheng_toolkit/bisheng_compiler/bin/ccec') != ''
        uses: actions/cache/save@v4
        with:
          path: bisheng_toolkit
          key: cann-9.1.0-bisheng-${{ matrix.config.arch }}

      - name: Compute source pin
        id: pin
        run: |
          SHA="$(git -C third_party/ascend/AscendNPU-IR rev-parse HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha8=$(echo "${SHA}" | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "${SHA}" > npuir-sha.txt

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/ascend/AscendNPU-IR/build
            third_party/ascend/AscendNPU-IR/build_hivmc
            .ccache
          key: bisheng-${{ matrix.config.arch }}-${{ steps.pin.outputs.sha }}
          restore-keys: |
            bisheng-${{ matrix.config.arch }}-

      - name: Show pod resources
        run: |
          echo "nproc: $(nproc)"
          echo "--- /proc/meminfo (head) ---"
          head -6 /proc/meminfo
          echo "--- cgroup limits ---"
          cat /sys/fs/cgroup/memory.max 2>/dev/null || \
            cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || \
            echo "(no readable cgroup memory limit)"
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || \
            cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us 2>/dev/null || \
            echo "(no readable cgroup cpu limit)"

      - name: Build AscendNPU-IR from source
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          BISHENG_DIR: ${{ steps.bisheng.outputs.bisheng_dir }}
          # Both pods are actually 16 CPUs / 32 GB (cgroup limits: cpu.max
          # 1600000/100000, memory.max 32GiB); nproc reports host cores
          # (320/64) and is meaningless here. 32 parallel clang jobs OOM'd a
          # cold build on a heavy MLIR TU. Cold builds keep 12 (~2.5GB per
          # job); warm builds are mostly ccache hits and can use all 16 CPUs
          # (more would just oversubscribe).
          BUILD_JOBS: ${{ steps.build-cache.outputs.cache-hit == 'true' && '16' || '12' }}
        run: |
          cd third_party/ascend/AscendNPU-IR
          # npuir master's device-print templates reference compiler markers
          # no publicly available bisheng compiler defines (verified on the
          # image's and the OBS CANN 9.1.0 toolkits, both clang 15.0.5):
          # CCE_PRINT_CC (type qualifier) and CCE_DEBUG_NAME (declaration
          # wrapper). Everything else the templates need (cce::printf,
          # --cce-enable-print, the #ifdef feature guards) IS supported, and
          # the pre-refactor code (e.g. the previous npuir pin) declared these
          # functions without the markers. Define them transparently to
          # restore that behavior instead of skipping the templates: the mix
          # meta_op groups (meta_op.mix.*.bc) are populated ONLY by the Debug
          # templates, and the install step requires them.
          python3 - <<'PYEOF'
          # 1) Define the newer-compiler markers transparently.
          p = "bishengir/lib/Template/include/Debug/DebugUtils.h"
          s = open(p).read()
          shim = (
              "#ifndef CCE_PRINT_CC\n#define CCE_PRINT_CC\n#endif\n"
              "#ifndef CCE_DEBUG_NAME\n#define CCE_DEBUG_NAME(x) x\n#endif\n"
          )
          assert s.count('#include "Utils.h"') == 1
          s = s.replace('#include "Utils.h"\n', '#include "Utils.h"\n' + shim)
          open(p, "w").write(s)
          # 2) Drop uint64_t print registrations: on LP64 uint64_t is unsigned
          # long, which the public compilers' cce::printf Support<> whitelist
          # does not cover (static_assert "Unsupported datatype!"). The
          # deployed OBS package predates the print templates entirely, so
          # this still leaves the package strictly more capable.
          d = "bishengir/lib/Template/lib/Debug/Debug.cpp"
          s = open(d).read()
          for line in (
              "REGISTER_PRINT_SCALAR(uint64_t, gm)",
              "REGISTER_PRINT_1TO8D_TENSOR(uint64_t, gm)",
              "REGISTER_PRINT_SCALAR(uint64_t, ubuf)",
              "REGISTER_PRINT_1TO8D_TENSOR(uint64_t, ubuf)",
          ):
              assert line in s, line
              s = s.replace(line + "\n", "")
          open(d, "w").write(s)
          # 3) Skip the SIMT Debug variant: it compiles the same Debug.cpp with
          # -DCCE_PRINT_SIMT=1 and exports the same _mlir_ciface_print_*
          # symbols as the regular variant; llvm-link rejects both in one
          # group ("symbol multiply defined"). The upstream compiler likely
          # avoids this via CCE_PRINT_CC's real semantics, which public
          # compilers do not have.
          c = "bishengir/lib/Template/lib/RegBase/Debug/CMakeLists.txt"
          s = open(c).read()
          assert "add_subdirectory(SIMT)" in s
          s = s.replace("add_subdirectory(SIMT)\n", "")
          open(c, "w").write(s)
          PYEOF
          echo "Building with -j ${BUILD_JOBS} (cold=12, warm=16)"
          build-tools/build.sh -o build -j "${BUILD_JOBS}" \
            --add-cmake-options="-DCMAKE_LINKER=LLD" \
            --add-cmake-options="-DLLVM_ENABLE_LLD=ON" \
            --add-cmake-options="-DLLVM_PARALLEL_LINK_JOBS=1" \
            -t \
            --bisheng-compiler="${BISHENG_DIR}" \
            --build-torch-mlir \
            --safety-options --safety-ld-options --skip-rpath \
            --collect-binary "$GITHUB_WORKSPACE/bishengir-output"

      - name: Save build cache
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/ascend/AscendNPU-IR/build
            third_party/ascend/AscendNPU-IR/build_hivmc
            .ccache
          key: bisheng-${{ matrix.config.arch }}-${{ steps.pin.outputs.sha }}

      - name: Package .run installer
        id: package
        run: |
          set -eu
          NPUIR_DIR=third_party/ascend/AscendNPU-IR
          ver_part() {
            sed -n "s/.*set(BISHENGIR_VERSION_$1 \([0-9]*\)).*/\1/p" \
              "${NPUIR_DIR}/bishengir/cmake/modules/BiShengIRVersion.cmake" | head -1
          }
          VER="$(ver_part MAJOR).$(ver_part MINOR).$(ver_part PATCHLEVEL)"
          PKG="ascendnpu-ir_${VER}_linux-${{ matrix.config.arch }}-${{ steps.pin.outputs.sha8 }}.run"

          mkdir -p bisheng_toolkit/bishengir
          cp -a bishengir-output/bin bishengir-output/lib bisheng_toolkit/bishengir/
          cp -a .github/workflows/build/bisheng-package/script bisheng_toolkit/
          cp -a .github/workflows/build/bisheng-package/set_env.sh bisheng_toolkit/

          # Substitute packaging-time placeholders in install.sh.
          sed -i "s/TARGET_BUILD_ARCH/${{ matrix.config.target_arch }}/" \
            bisheng_toolkit/script/install.sh
          sed -i "s/BASE_PACKAGE_VERSION=\"1.1.0\"/BASE_PACKAGE_VERSION=\"${VER}\"/; \
                  s/PACKAGE_VERSION=\"1.1.0\"/PACKAGE_VERSION=\"${VER}\"/" \
            bisheng_toolkit/script/install.sh

          # Stock makeself 2.5.0, the same version the OBS package was built
          # with. The repo's makeself-header.sh adds a whitelist forwarding
          # --install/--install-path/... to the embedded install.sh, the same
          # way the original package's custom header did (stock makeself
          # rejects unknown flags instead of forwarding them).
          curl -fL "https://github.com/megastep/makeself/releases/download/release-2.5.0/makeself-2.5.0.run" \
            -o makeself-2.5.0.run
          chmod +x makeself-2.5.0.run
          if ! ./makeself-2.5.0.run --nox11 --target makeself-2.5.0; then
            ./makeself-2.5.0.run --nox11 --extract=makeself-2.5.0
          fi
          makeself-2.5.0/makeself.sh \
            --header .github/workflows/build/bisheng-package/makeself-header.sh \
            --help-header .github/workflows/build/bisheng-package/help.txt \
            --gzip --complevel 4 --nomd5 --sha256 \
            bisheng_toolkit "${PKG}" ASCEND_RUN_PACKAGE script/install.sh

          echo "pkg_name=${PKG}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test installer
        run: |
          set -eu
          SMOKE_DIR=/tmp/bisheng-smoke
          rm -rf "${SMOKE_DIR}"
          chmod +x "${{ steps.package.outputs.pkg_name }}"
          ./"${{ steps.package.outputs.pkg_name }}" --quiet --install --install-path="${SMOKE_DIR}"
          test -x "${SMOKE_DIR}/tools/bishengir/bin/bishengir-compile"
          test -x "${SMOKE_DIR}/tools/bishengir/bin/bishengir-opt"
          test -x "${SMOKE_DIR}/tools/bishengir/bin/hivmc-a5"
          test -f "${SMOKE_DIR}/tools/bishengir/lib/meta_op.aiv.c220.bc"
          echo "Installer smoke test passed."

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: bisheng-${{ matrix.config.arch }}
          path: |
            ascendnpu-ir_*.run
            npuir-sha.txt
          if-no-files-found: error

      - name: Upload package to OBS
        if: github.event_name == 'push' && github.repository == 'triton-lang/triton-ascend'
        env:
          AK: ${{ secrets.OBS_AK }}
          SK: ${{ secrets.OBS_SK }}
          PKG: ${{ steps.package.outputs.pkg_name }}
        run: |
          set -eu
          if [ -z "${AK}" ] || [ -z "${SK}" ]; then
            echo "OBS credentials are empty."
            exit 1
          fi
          if [ "${{ matrix.config.arch }}" = "x86_64" ]; then
            OBS_UTIL_ARCH=amd64
          else
            OBS_UTIL_ARCH=arm64
          fi
          curl -fL "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_${OBS_UTIL_ARCH}.tar.gz" -o obsutil.tar.gz
          gzip -t obsutil.tar.gz
          tar xzf obsutil.tar.gz
          rm -f obsutil.tar.gz
          mv obsutil_linux_* obsutil
          obsutil/obsutil config -i="${AK}" -k="${SK}" -e=https://obs.cn-southwest-2.myhuaweicloud.com
          obsutil/obsutil cp "${PKG}" "obs://triton-ascend-artifacts/cann/${PKG}"

      - name: Ccache stats
        run: ccache --print-stats || true

  # Opens a PR updating cmake/bisheng-version.txt to the freshly built packages
  # so integration-tests-ascend.yml picks them up.
  update-version-file:
    name: Update cmake/bisheng-version.txt
    needs: build
    if: github.event_name == 'push' && github.repository == 'triton-lang/triton-ascend'
    runs-on: linux-amd64-cpu-4
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/bisheng-packages

      - name: Update version file and open PR
        env:
          TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          NEW_FILE=$(mktemp)
          PR_BODY=$(mktemp)
          NPUIR_SHA=$(cat /tmp/bisheng-packages/bisheng-x86_64/npuir-sha.txt)
          {
            echo "Built from AscendNPU-IR commit \`${NPUIR_SHA}\`."
            echo
          } > "${PR_BODY}"
          for ARCH in aarch64 x86_64; do
            PKG=$(ls /tmp/bisheng-packages/bisheng-${ARCH}/ascendnpu-ir_*.run)
            SHA=$(sha256sum "${PKG}" | awk '{print $1}')
            echo "${ARCH}: $(basename "${PKG}")" >> "${NEW_FILE}"
            echo "${ARCH}_sha256: ${SHA}" >> "${NEW_FILE}"
            echo "- \`$(basename "${PKG}")\` (sha256 \`${SHA}\`)" >> "${PR_BODY}"
          done

          if cmp -s "${NEW_FILE}" cmake/bisheng-version.txt; then
            echo "cmake/bisheng-version.txt is already up to date, nothing to do."
            exit 0
          fi

          SHA8=$(echo "${NPUIR_SHA}" | cut -c1-8)
          BRANCH="ci/update-bisheng-${SHA8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          cp "${NEW_FILE}" cmake/bisheng-version.txt
          git add cmake/bisheng-version.txt
          git commit -m "[build](chore) update bisheng package to ${SHA8}"
          git push "https://x-access-token:${TOKEN}@github.com/triton-lang/triton-ascend.git" "HEAD:refs/heads/${BRANCH}"

          PAYLOAD=$(python3 - "${SHA8}" "${BRANCH}" "${GITHUB_REF_NAME}" "$(cat "${PR_BODY}")" <<'PYEOF'
          import json, sys
          sha8, branch, base, body = sys.argv[1:5]
          print(json.dumps({
              "title": f"[build](chore) update bisheng package to {sha8}",
              "head": branch,
              "base": base,
              "body": body,
          }))
          PYEOF
          )
          curl -sS -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/triton-lang/triton-ascend/pulls" \
            -d "${PAYLOAD}" || echo "PR creation failed (a PR for this branch may already exist)."
