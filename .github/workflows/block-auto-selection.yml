name: CPU block auto selection

on:
  pull_request:
    paths:
      - 'tools/block_auto_select/**'
      - '.github/workflows/block-auto-selection.yml'
  push:
    paths:
      - 'tools/block_auto_select/**'
      - '.github/workflows/block-auto-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q tools/block_auto_select
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
