name: CPU block auto selection

on:
  pull_request:
    paths:
      - 'tools/block_auto_select/**'
      - 'third_party/ascend/backend/**'
      - 'third_party/ascend/build/**'
      - 'third_party/ascend/unittest/pytest_ut/block_auto/**'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/block-auto-selection.yml'
  push:
    paths:
      - 'tools/block_auto_select/**'
      - 'third_party/ascend/backend/**'
      - 'third_party/ascend/build/**'
      - 'third_party/ascend/unittest/pytest_ut/block_auto/**'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/block-auto-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<9' 'setuptools>=70,<81' 'pybind11>=2.13.1,<4' wheel
      - run: >-
          python -m pytest -q
          --confcutdir=third_party/ascend/unittest/pytest_ut/block_auto
          third_party/ascend/unittest/pytest_ut/block_auto
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONNOUSERSITE: '1'
