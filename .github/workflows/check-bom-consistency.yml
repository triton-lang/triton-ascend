name: BOM Consistency Check

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run metadata regression tests
        run: |
          python -m pip install pytest setuptools wheel
          python -m pytest -q third_party/ascend/build_tests

      - name: Run BOM consistency checks
        run: python3 scripts/check_bom_consistency.py
