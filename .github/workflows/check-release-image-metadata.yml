name: Release image metadata tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - name: Exercise release readers and patch verification
        run: python -m pytest -q third_party/ascend/build_tests/test_release_image_reads.py
