name: Optional source metadata tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install pytest setuptools wheel
      - name: Exercise source selection and workflow readers
        run: >-
          python -m pytest -q
          third_party/ascend/build_tests/test_ci_dependency_refs.py
          third_party/ascend/build_tests/test_distributed_metadata.py
