name: Integration Tests
on:
  workflow_dispatch:
  pull_request:
    paths: &ci-paths
      - 'python/**'
      - 'lib/**'
      - 'include/**'
      - 'bin/**'
      - 'third_party/**'
      - 'test/**'
      - 'unittest/**'
      - 'utils/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'Makefile'
      - 'safe_compile.cmake'
      - 'version.txt'
      - '.github/workflows/ci.yml'
      - '.github/workflows/integration-tests-ascend.yml'
      - '.github/workflows/runner-preparation.yml'
  merge_group:
    branches: [main, 'release/**', '**-dev']
    types: [checks_requested]
  push:
    branches: [main, 'release/**', '**-dev']
    paths: *ci-paths
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions: read-all

jobs:

  runner-preparation:
    uses: ./.github/workflows/runner-preparation.yml

  integration-tests-ascend:
    needs: runner-preparation
    if: needs.runner-preparation.outputs.matrix-ASCEND != ''
    uses: ./.github/workflows/integration-tests-ascend.yml
    with:
      matrix: ${{ needs.runner-preparation.outputs.matrix-ASCEND }}
