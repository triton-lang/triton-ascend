name: Integration Tests NPU

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string

jobs:
  integration-tests-ascend:
    name: integration-tests-ascend (${{ matrix.config.runs_on[0] }}, py${{ matrix.config.python_version }})
    runs-on: ${{ matrix.config.runs_on }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/triton:${{ matrix.config.cann_version }}-${{ matrix.config.chip_type }}-${{ matrix.config.os }}-py${{ matrix.config.python_version }}-latest
    timeout-minutes: 300
    strategy:
      matrix:
        # Each config entry carries its full environment (cann_version,
        # chip_type, os, python_version) because chips differ: a3 uses
        # cann8.5.0/py3.10+3.11 while a5 (Ascend 950) uses cann9.1.0/py3.12.
        config: ${{ fromJson(inputs.matrix) }}
      fail-fast: false
    env:
      PROTON_SKIP_PC_SAMPLING_TEST: 1
      PYTHON: "python${{ matrix.config.python_version }}"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      PIP_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Add git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.triton/llvm
            ~/.triton/json
            ~/.triton/nvidia
            ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-cann${{ matrix.config.cann_version }}-${{ matrix.config.os }}-${{ matrix.config.chip_type }}-py${{ matrix.config.python_version }}-triton-${{ hashFiles('cmake/llvm-hash.txt', 'cmake/json-version.txt', 'cmake/nvidia-toolchain-version.json', 'third_party/ascend/patch/llvm_patch_*.patch') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cann${{ matrix.config.cann_version }}-${{ matrix.config.os }}-${{ matrix.config.chip_type }}-py${{ matrix.config.python_version }}-triton-

      - name: Download npuir payload from PR build
        id: payload-pr
        # Pre-merge testing: take the payload built by this PR's npuir-build
        # run (GitHub artifact), so a submodule bump can be tested before
        # merge. Falls back to the OBS object for the exact pinned commit.
        uses: dawidd6/action-download-artifact@v9
        continue-on-error: true
        with:
          workflow: npuir-build.yml
          workflow_conclusion: success
          allow_forks: true
          branch: ${{ github.head_ref || github.ref_name }}
          name: npuir-payload-manylinux-${{ matrix.config.chip_type == 'a3' && 'aarch64' || 'x86_64' }}
          path: npuir-artifacts

      - name: Prepare npuir payload
        shell: bash
        run: |
          set -eu
          # The payload (bishengir-compile/opt + meta_op libs) is built by
          # npuir-build.yml (manylinux variant) and bundled into the wheel
          # below via TRITON_ASCEND_BISHENGIR_PATH.
          BIN=$(find npuir-artifacts -name bishengir-compile -type f 2>/dev/null | head -1 || true)
          if [ -n "${BIN}" ]; then
            PAYLOAD_DIR=$(dirname "$(dirname "${BIN}")")
            echo "Using PR-build payload at ${PAYLOAD_DIR}"
          else
            echo "No PR-build artifact; downloading the OBS object for the pinned commit"
            ARCH=$(uname -m)
            SHA8=$(git -C third_party/ascend/AscendNPU-IR rev-parse --short=8 HEAD)
            OBS_BASE="https://triton-ascend-artifacts.obs.cn-southwest-2.myhuaweicloud.com/npuir"
            if ! curl -fL --connect-timeout 30 --retry 5 --retry-all-errors \
                 --retry-delay 10 \
                 "${OBS_BASE}/npuir-payload-manylinux-${ARCH}-${SHA8}.tar.gz" \
                 -o npuir-payload.tar.gz; then
              echo "Payload for npuir pin ${SHA8} (${ARCH}) is not available." >&2
              echo "If this PR bumps the AscendNPU-IR submodule, wait for its" >&2
              echo "npuir-build run to finish, then re-run the tests." >&2
              exit 1
            fi
            mkdir -p npuir-payload-dl
            tar xzf npuir-payload.tar.gz -C npuir-payload-dl
            PAYLOAD_DIR="$GITHUB_WORKSPACE/npuir-payload-dl"
          fi
          # Normalize into the path the build step's TRITON_ASCEND_BISHENGIR_PATH
          # points at.
          rm -rf npuir-payload
          mkdir -p npuir-payload
          cp -a "${PAYLOAD_DIR}/bin" npuir-payload/
          cp -a "${PAYLOAD_DIR}/lib" npuir-payload/
          # GitHub artifact zips carry no unix permission bits (upload-artifact
          # zips without setUnixMode) and action-download-artifact extracts
          # via adm-zip as 0644, so restore the exec bit explicitly.
          chmod -R a+x npuir-payload/bin
          test -x npuir-payload/bin/bishengir-compile
          test -x npuir-payload/bin/bishengir-opt
          test -d npuir-payload/lib
          ls -la npuir-payload/bin

      - name: Build and install triton-ascend
        shell: bash
        env:
          TRITON_BUILD_WITH_CCACHE: "true"
          TRITON_BUILD_WITH_CLANG_LLD: "TRUE"
          TRITON_DISABLE_LINE_INFO: 1
          CCACHE_COMPRESS: "true"
          TRITON_BUILD_WITH_O1: true
          TRITON_BUILD_TD: ON
          TRITON_BUILD_PROTON: OFF
          TRITON_WHEEL_NAME: triton-ascend
          TRITON_APPEND_CMAKE_ARGS: "-DTRITON_BUILD_UT=ON"
          # Building the BishengIR payload here (TRITON_BUILD_NPUIR=ON) is not
          # viable on the current pods: the a3 images (CANN 8.5.0) lack the
          # --cce-enable-print compiler flag the npuir templates require, and
          # the a5 pods have less than the 30 GiB free disk build_npuir.py
          # demands. The payload is built by the wheels pipeline
          # (wheels.yml build-npuir, CANN 9.2 image) and downloaded above;
          # bundling it via TRITON_ASCEND_BISHENGIR_PATH puts it at
          # triton/backends/ascend/backend/bishengir in the installed wheel.
          # ${{ github.workspace }} (not $GITHUB_WORKSPACE): the cluster runner
          # does not shell-expand $VAR in step env values, so the literal
          # $GITHUB_WORKSPACE string would reach setup.py unresolved.
          TRITON_ASCEND_BISHENGIR_PATH: "${{ github.workspace }}/npuir-payload"
        run: |
          nproc
          echo "TRITON_ASCEND_BISHENGIR_PATH=${TRITON_ASCEND_BISHENGIR_PATH}"
          source /usr/local/Ascend/cann/set_env.sh
          npu-smi info
          if [ -n "${ASCEND_TOOLKIT_HOME}" ] && [ -f "${ASCEND_TOOLKIT_HOME}/cann/version.info" ]; then
            cat "${ASCEND_TOOLKIT_HOME}/cann/version.info"
          fi

          ccache --zero-stats
          NUM_PROCS=$(( $(nproc) / 3 ))
          if [ "$NUM_PROCS" -lt 1 ]; then NUM_PROCS=1; fi
          if [ -f setup_ascend.py ]; then
            SETUP_DIR="./"
            SETUP_PY="setup_ascend.py"
          elif [ -f setup.py ]; then
            SETUP_DIR="./"
            SETUP_PY="setup.py"
          elif [ -f python/setup.py ]; then
            SETUP_DIR="python"
            SETUP_PY="setup.py"
          else
            echo "ERROR: setup.py or setup_ascend.py not found" >&2
            exit 1
          fi
          cd "$SETUP_DIR"
          MAX_JOBS="$NUM_PROCS" \
          ${PYTHON} ${SETUP_PY} bdist_wheel
          ${PYTHON} -m pip install dist/*.whl

      - name: CCache stats
        run: ccache --print-stats

      - name: Run unit tests on NPU
        shell: bash
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          # bishengir-compile/opt are bundled inside the installed wheel;
          # backend/utils.py prefers the bundled copy.
          NUM_PROCS=$(( $(nproc) / 9 ))
          if [ "$NUM_PROCS" -lt 1 ]; then NUM_PROCS=1; fi
          ${PYTHON} -m pytest -s -v -n "$NUM_PROCS" --dist=loadfile third_party/ascend/unittest/pytest_ut
          ${PYTHON} -m pytest -s -v -n "$NUM_PROCS" --dist=loadfile third_party/ascend/unittest/autotune_ut
          # NOTE: kernel tests are temporarily disabled due to intermittent failures
          # that cause CI instability. TODO: Fix flaky kernel tests and re-enable.
          # ${PYTHON} -m pytest -s -v -n "$NUM_PROCS" --dist=loadfile third_party/ascend/unittest/kernels/test_triton_kernel.py

      - name: Run compiler unit and MLIR tests
        shell: bash
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          # bishengir binaries are bundled inside the installed wheel.
          TEST_MLIR_DIR=$(ls -d build/cmake.*/third_party/ascend/unittest 2>/dev/null | head -1 || true)
          echo "TEST_MLIR_DIR=${TEST_MLIR_DIR:-<not found>}"
          if [ -n "${TEST_MLIR_DIR}" ] && [ -d "${TEST_MLIR_DIR}" ]; then
            ctest --test-dir "${TEST_MLIR_DIR}" --output-on-failure \
              --no-tests=error -R '^TestTritonOffsetCacheLifetime$'
            lit -v "${TEST_MLIR_DIR}"
          else
            echo "MLIR test directory not found."
            echo "Expected to match: build/cmake.*/third_party/ascend/unittest"
            echo "Working directory: $(pwd)"
            if [ -d build ]; then
              echo "Contents of build directory:"
              find build -maxdepth 4 -print
            else
              echo "build directory does not exist"
            fi
            exit 1
          fi
