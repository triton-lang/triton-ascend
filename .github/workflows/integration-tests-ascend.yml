name: Integration Tests NPU

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string

jobs:
  integration-tests-ascend:
    name: integration-tests-ascend (${{ matrix.config.name }}, py${{ matrix.config.python_version }})
    runs-on: ${{ matrix.config.runs_on }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/triton:${{ matrix.config.cann_version }}-${{ matrix.config.chip_type }}-${{ matrix.config.os }}-py${{ matrix.config.python_version }}-latest
    timeout-minutes: 300
    strategy:
      matrix:
        # Each config entry carries its full environment (cann_version,
        # chip_type, os, python_version) because chips differ: a3 uses
        # cann8.5.0/py3.10+3.11 while a5 (Ascend 950) uses cann9.1.0/py3.12.
        config: ${{ fromJson(inputs.matrix) }}
      fail-fast: false
    env:
      PROTON_SKIP_PC_SAMPLING_TEST: 1
      PYTHON: "python${{ matrix.config.python_version }}"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      PIP_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Add git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.triton/llvm
            ~/.triton/json
            ~/.triton/nvidia
            ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-cann${{ matrix.config.cann_version }}-${{ matrix.config.os }}-${{ matrix.config.chip_type }}-py${{ matrix.config.python_version }}-triton-${{ hashFiles('cmake/llvm-hash.txt', 'cmake/json-version.txt', 'cmake/nvidia-toolchain-version.json', 'third_party/ascend/patch/llvm_patch_*.patch') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cann${{ matrix.config.cann_version }}-${{ matrix.config.os }}-${{ matrix.config.chip_type }}-py${{ matrix.config.python_version }}-triton-

      - name: Download and install Bisheng compiler
        shell: bash
        run: |
          if [ ! -f cmake/bisheng-version.txt ]; then
            echo "cmake/bisheng-version.txt not found, skipping"
            exit 0
          fi

          # The ascendnpu-ir run package is arch-specific: aarch64 (a3) and
          # x86_64 (a5) each have their own; select by the container's arch.
          ARCH=$(uname -m)
          OBS_BASE="https://triton-ascend-artifacts.obs.cn-southwest-2.myhuaweicloud.com"
          BISHENG_FILENAME=$(sed -n "s/^${ARCH}: //p" cmake/bisheng-version.txt | xargs)
          BISHENG_SHA256=$(sed -n "s/^${ARCH}_sha256: //p" cmake/bisheng-version.txt | xargs)

          if [ -z "${BISHENG_FILENAME}" ]; then
            echo "Error: cmake/bisheng-version.txt has no entry for arch ${ARCH}." >&2
            exit 1
          fi

          echo "Downloading: ${BISHENG_FILENAME} (arch=${ARCH})"
          # Retry with resume: this download has been killed mid-flight
          # (exit 137, k8s memory limit / node OOM) and can drop on flaky
          # networks; -C - resumes from where the previous attempt stopped.
          curl -fL --connect-timeout 30 --retry 5 --retry-all-errors \
            --retry-delay 10 -C - \
            "${OBS_BASE}/cann/${BISHENG_FILENAME}" -o bisheng.run

          if [ -n "${BISHENG_SHA256}" ]; then
            echo "Verifying SHA256 checksum..."
            echo "${BISHENG_SHA256}  bisheng.run" | sha256sum -c -
          else
            echo "Warning: No SHA256 checksum provided, skipping verification"
          fi

          chmod +x bisheng.run
          ./bisheng.run --quiet --install --install-path=/usr/local/bisheng
          echo "/usr/local/bisheng/tools/bishengir/bin" >> $GITHUB_PATH

      - name: Build and install triton-ascend
        shell: bash
        env:
          TRITON_BUILD_WITH_CCACHE: "true"
          TRITON_BUILD_WITH_CLANG_LLD: "TRUE"
          TRITON_DISABLE_LINE_INFO: 1
          CCACHE_COMPRESS: "true"
          TRITON_BUILD_WITH_O1: true
          TRITON_BUILD_TD: ON
          TRITON_BUILD_PROTON: OFF
          TRITON_WHEEL_NAME: triton-ascend
          TRITON_APPEND_CMAKE_ARGS: "-DTRITON_BUILD_UT=ON"
        run: |
          nproc
          source /usr/local/Ascend/cann/set_env.sh
          export PATH="/usr/local/bisheng/tools/bishengir/bin:$PATH"
          npu-smi info
          if [ -n "${ASCEND_TOOLKIT_HOME}" ] && [ -f "${ASCEND_TOOLKIT_HOME}/cann/version.info" ]; then
            cat "${ASCEND_TOOLKIT_HOME}/cann/version.info"
          fi

          ccache --zero-stats
          NUM_PROCS=$(( $(nproc) / 3 ))
          if [ "$NUM_PROCS" -lt 1 ]; then NUM_PROCS=1; fi
          if [ -f setup_ascend.py ]; then
            SETUP_DIR="./"
            SETUP_PY="setup_ascend.py"
          elif [ -f setup.py ]; then
            SETUP_DIR="./"
            SETUP_PY="setup.py"
          elif [ -f python/setup.py ]; then
            SETUP_DIR="python"
            SETUP_PY="setup.py"
          else
            echo "ERROR: setup.py or setup_ascend.py not found" >&2
            exit 1
          fi
          cd "$SETUP_DIR"
          MAX_JOBS="$NUM_PROCS" \
          ${PYTHON} ${SETUP_PY} bdist_wheel
          ${PYTHON} -m pip install dist/*.whl

      - name: CCache stats
        run: ccache --print-stats

      - name: Run unit tests on NPU
        shell: bash
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          export PATH="/usr/local/bisheng/tools/bishengir/bin:$PATH"
          NUM_PROCS=$(( $(nproc) / 9 ))
          if [ "$NUM_PROCS" -lt 1 ]; then NUM_PROCS=1; fi
          ${PYTHON} -m pytest -s -v -n "$NUM_PROCS" --dist=loadfile third_party/ascend/unittest/pytest_ut
          ${PYTHON} -m pytest -s -v -n "$NUM_PROCS" --dist=loadfile third_party/ascend/unittest/autotune_ut
          # NOTE: kernel tests are temporarily disabled due to intermittent failures
          # that cause CI instability. TODO: Fix flaky kernel tests and re-enable.
          # ${PYTHON} -m pytest -s -v -n "$NUM_PROCS" --dist=loadfile third_party/ascend/unittest/kernels/test_triton_kernel.py

      - name: Run MLIR FileCheck tests
        shell: bash
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          export PATH="/usr/local/bisheng/tools/bishengir/bin:$PATH"
          TEST_MLIR_DIR=$(ls -d build/cmake.*/third_party/ascend/unittest 2>/dev/null | head -1 || true)
          echo "TEST_MLIR_DIR=${TEST_MLIR_DIR:-<not found>}"
          if [ -n "${TEST_MLIR_DIR}" ] && [ -d "${TEST_MLIR_DIR}" ]; then
            lit -v "${TEST_MLIR_DIR}"
          else
            echo "MLIR test directory not found."
            echo "Expected to match: build/cmake.*/third_party/ascend/unittest"
            echo "Working directory: $(pwd)"
            if [ -d build ]; then
              echo "Contents of build directory:"
              find build -maxdepth 4 -print
            else
              echo "build directory does not exist"
            fi
            exit 1
          fi
