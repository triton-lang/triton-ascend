name: Restricted Files Reminder

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-files:
    name: restricted files reminder
    runs-on: ubuntu-latest
    steps:
      - name: Check restricted files reminder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          allowed_dirs=(
            ".github/"
            "docker/"
            "docs/"
            "third_party/"
          )

          allowed_files=(
            ".readthedocs.yaml"
            "CONTRIBUTING.md"
            "CONTRIBUTING_zh.md"
            "README.md"
            "README_zh.md"
            "RELEASE.md"
            "requirements.txt"
            "requirements_dev.txt"
          )

          mapfile -t changed_files < <(
            gh api --paginate \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename'
          )

          violations=()
          for changed_file in "${changed_files[@]}"; do
            allowed=false

            for allowed_file in "${allowed_files[@]}"; do
              if [[ "${changed_file}" == "${allowed_file}" ]]; then
                allowed=true
                break
              fi
            done

            if [[ "${allowed}" == "false" ]]; then
              for allowed_dir in "${allowed_dirs[@]}"; do
                if [[ "${changed_file}" == "${allowed_dir}"* ]]; then
                  allowed=true
                  break
                fi
              done
            fi

            if [[ "${allowed}" == "false" ]]; then
              violations+=("${changed_file}")
            fi
          done

          if (( ${#violations[@]} > 0 )); then
            {
              echo "::error title=Restricted file reminder::Changes outside the allowed repository-construction paths need committer attention."
              echo "This is a non-required reminder check during repository construction."
              echo "Allowed directories:"
              printf '  - %s\n' "${allowed_dirs[@]}"
              echo "Allowed files:"
              printf '  - %s\n' "${allowed_files[@]}"
              echo "The following changed file(s) are outside the allowed paths:"
              printf '  - %s\n' "${violations[@]}"
            } >&2
            exit 1
          fi

          {
            echo "All changed files are within the allowed repository-construction paths."
            echo "Allowed directories:"
            printf '  - %s\n' "${allowed_dirs[@]}"
            echo "Allowed files:"
            printf '  - %s\n' "${allowed_files[@]}"
          }
