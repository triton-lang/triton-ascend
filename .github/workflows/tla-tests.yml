name: TLA Tests

# Dedicated pipeline monitoring TLA (triton.language.extra.tla) changes.
# TLA only targets the a5 (Ascend 950) environment, so a single job on the
# a5 NPU runner tests the two stages as separate steps sharing one wheel
# build (the whole suite takes ~1 min):
#   - TLA_TEST_STAGE=ir : offline HIVM IR structure asserts.
#   - TLA_TEST_STAGE=run: device launch + accuracy, implies ir+compile.
on:
  pull_request:
    paths:
      - 'third_party/ascend/language/tla/**'
      - 'third_party/ascend/unittest/tla_ut/**'
      - 'third_party/ascend/backend/compiler.py'
      - '.github/workflows/tla-tests.yml'
  workflow_dispatch:

concurrency:
  group: tla-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tla-tests:
    name: tla-tests (a5, py3.12)
    # a5 (Ascend 950) environment: cann9.1.0 / ubuntu22.04 / py3.12.
    runs-on: [linux-amd64-a5-2]
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/triton:9.1.0-950-ubuntu22.04-py3.12-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      PYTHON: python3.12
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      PIP_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Add git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.triton/llvm
            ~/.triton/json
            ~/.triton/nvidia
            ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-cann9.1.0-ubuntu22.04-950-py3.12-tla-${{ hashFiles('cmake/llvm-hash.txt', 'cmake/json-version.txt', 'cmake/nvidia-toolchain-version.json', 'third_party/ascend/patch/llvm_patch_*.patch') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cann9.1.0-ubuntu22.04-950-py3.12-tla-

      - name: Download and install Bisheng compiler
        shell: bash
        run: |
          if [ ! -f cmake/bisheng-version.txt ]; then
            echo "cmake/bisheng-version.txt not found, skipping"
            exit 0
          fi

          # The ascendnpu-ir run package is arch-specific: aarch64 (a3) and
          # x86_64 (a5) each have their own; select by the container's arch.
          ARCH=$(uname -m)
          OBS_BASE="https://triton-ascend-artifacts.obs.cn-southwest-2.myhuaweicloud.com"
          BISHENG_FILENAME=$(sed -n "s/^${ARCH}: //p" cmake/bisheng-version.txt | xargs)
          BISHENG_SHA256=$(sed -n "s/^${ARCH}_sha256: //p" cmake/bisheng-version.txt | xargs)

          if [ -z "${BISHENG_FILENAME}" ]; then
            echo "Error: cmake/bisheng-version.txt has no entry for arch ${ARCH}." >&2
            exit 1
          fi

          echo "Downloading: ${BISHENG_FILENAME} (arch=${ARCH})"
          curl -fL --connect-timeout 30 --retry 5 --retry-all-errors \
            --retry-delay 10 -C - \
            "${OBS_BASE}/cann/${BISHENG_FILENAME}" -o bisheng.run

          if [ -n "${BISHENG_SHA256}" ]; then
            echo "Verifying SHA256 checksum..."
            echo "${BISHENG_SHA256}  bisheng.run" | sha256sum -c -
          else
            echo "Warning: No SHA256 checksum provided, skipping verification"
          fi

          chmod +x bisheng.run
          ./bisheng.run --quiet --install --install-path=/usr/local/bisheng
          echo "/usr/local/bisheng/tools/bishengir/bin" >> $GITHUB_PATH

      - name: Build and install triton-ascend
        shell: bash
        env:
          TRITON_BUILD_WITH_CCACHE: "true"
          TRITON_BUILD_WITH_CLANG_LLD: "TRUE"
          TRITON_DISABLE_LINE_INFO: 1
          CCACHE_COMPRESS: "true"
          TRITON_BUILD_WITH_O1: true
          TRITON_BUILD_PROTON: OFF
          TRITON_WHEEL_NAME: triton-ascend
          TRITON_APPEND_CMAKE_ARGS: "-DTRITON_BUILD_UT=OFF"
        run: |
          nproc
          source /usr/local/Ascend/cann/set_env.sh
          export PATH="/usr/local/bisheng/tools/bishengir/bin:$PATH"
          npu-smi info
          if [ -n "${ASCEND_TOOLKIT_HOME}" ] && [ -f "${ASCEND_TOOLKIT_HOME}/cann/version.info" ]; then
            cat "${ASCEND_TOOLKIT_HOME}/cann/version.info"
          fi

          ccache --zero-stats
          NUM_PROCS=$(( $(nproc) / 3 ))
          if [ "$NUM_PROCS" -lt 1 ]; then NUM_PROCS=1; fi
          if [ -f setup_ascend.py ]; then
            SETUP_DIR="./"
            SETUP_PY="setup_ascend.py"
          elif [ -f setup.py ]; then
            SETUP_DIR="./"
            SETUP_PY="setup.py"
          elif [ -f python/setup.py ]; then
            SETUP_DIR="python"
            SETUP_PY="setup.py"
          else
            echo "ERROR: setup.py or setup_ascend.py not found" >&2
            exit 1
          fi
          cd "$SETUP_DIR"
          MAX_JOBS="$NUM_PROCS" \
          ${PYTHON} ${SETUP_PY} bdist_wheel
          ${PYTHON} -m pip install dist/*.whl

      - name: CCache stats
        run: ccache --print-stats

      # NOTE: continue-on-error is temporary: several tla_ut cases still fail
      # on the current version, so failures must not block the PR yet.
      # TODO: fix the failing cases and remove continue-on-error.
      - name: Run TLA ir-stage tests
        shell: bash
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          export PATH="/usr/local/bisheng/tools/bishengir/bin:$PATH"
          NUM_PROCS=$(( $(nproc) / 9 ))
          if [ "$NUM_PROCS" -lt 1 ]; then NUM_PROCS=1; fi
          TLA_TEST_STAGE=ir \
          ${PYTHON} -m pytest -s -v -n "$NUM_PROCS" --dist=loadfile \
            third_party/ascend/unittest/tla_ut

      - name: Run TLA run-stage tests on NPU
        shell: bash
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          export PATH="/usr/local/bisheng/tools/bishengir/bin:$PATH"
          npu-smi info
          # Isolated cache so the compile-stage artifact checks
          # (.npubin/.o under TRITON_CACHE_DIR) only see this job's kernels.
          export TRITON_CACHE_DIR="${GITHUB_WORKSPACE}/.triton_cache"
          NUM_PROCS=$(( $(nproc) / 9 ))
          if [ "$NUM_PROCS" -lt 1 ]; then NUM_PROCS=1; fi
          # TLA_TEST_STAGE=run executes ir + compile + run for every case
          # (see third_party/ascend/unittest/tla_ut/utils/tla_test_utils.py).
          TLA_TEST_STAGE=run \
          ${PYTHON} -m pytest -s -v -n "$NUM_PROCS" --dist=loadfile \
            third_party/ascend/unittest/tla_ut
