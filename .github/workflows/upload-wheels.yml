name: Upload Wheels

on:
  workflow_dispatch:
    inputs:
      wheel_urls:
        description: >-
          List of prebuilt wheel (.whl) URLs to download and upload to OBS,
          separated by newlines and/or spaces.
        required: true
        type: string
      obs_dir:
        description: "Target OBS directory"
        required: false
        default: "obs://ascend-artifcat-packages/pypi/packages/ascend/repos/pypi/nightly/triton-ascend/"
        type: string
      upload_npuir:
        description: >-
          Also extract the npuir (bishengir) payload bundled inside the wheels
          and publish it to OBS cann/ as
          ascendnpu-ir_<version>_linux-<arch>[-<tag>].tar.gz tarballs.
        required: false
        default: false
        type: boolean
      npuir_version:
        description: "Version used in the npuir tarball filename (e.g. 2.0.0)"
        required: false
        default: "2.0.0"
        type: string
      npuir_tag:
        description: "Optional tag appended after linux-<arch> in the npuir tarball filename (e.g. 1102)"
        required: false
        default: ""
        type: string
      npuir_overwrite:
        description: "Overwrite the npuir tarball on OBS if one with the same name already exists"
        required: false
        default: false
        type: boolean

concurrency:
  group: upload-wheels-${{ github.ref }}
  # Do not cancel an in-flight upload: interrupting obsutil mid-copy could
  # leave partial objects behind.
  cancel-in-progress: false

permissions: read-all

jobs:

  Upload-Wheels:
    name: Upload prebuilt wheels to OBS
    runs-on: linux-amd64-cpu-8
    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      - name: Download wheels
        shell: bash
        env:
          WHEEL_URLS: ${{ github.event.inputs.wheel_urls }}
        run: |
          set -eu
          mkdir -p wheelhouse
          # Accept URLs separated by newlines, spaces, or a mix of both
          # (workflow_dispatch multi-line input may arrive as one line).
          mapfile -t urls < <(tr -s '[:space:]' '\n' <<< "$WHEEL_URLS" | grep -v '^$' || true)
          for url in "${urls[@]}"; do
            case "$url" in
              https://*) ;;
              *) echo "Only https:// URLs are allowed: $url"; exit 1 ;;
            esac
            fname="$(basename "${url%%\?*}")"
            # Wheel filenames percent-encode '+' (local version separator).
            fname="${fname//%2B/+}"
            case "$fname" in
              *.whl) ;;
              *) echo "Not a .whl file: $fname"; exit 1 ;;
            esac
            echo "Downloading $url -> wheelhouse/$fname"
            curl -fL --retry 3 --retry-delay 5 "$url" -o "wheelhouse/$fname"
            # Sanity check: a wheel is a zip archive.
            head -c 2 "wheelhouse/$fname" | grep -q 'PK' \
              || { echo "Downloaded file is not a valid zip/wheel: $fname"; exit 1; }
          done
          [ "${#urls[@]}" -gt 0 ] || { echo "No URLs provided."; exit 1; }
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          [ "${#wheels[@]}" -gt 0 ] || { echo "No wheels downloaded."; exit 1; }
          echo "Downloaded ${#wheels[@]} wheel(s):"
          ls -l "${wheels[@]}"

      - name: Setup obsutil and upload to OBS
        shell: bash
        env:
          AK: ${{ secrets.NIGHTLY_OBS_AK }}
          SK: ${{ secrets.NIGHTLY_OBS_SK }}
          OBS_DIR: ${{ github.event.inputs.obs_dir }}
        run: |
          set -eu
          if [ -z "${AK}" ] || [ -z "${SK}" ]; then
            echo "OBS credentials are empty."
            exit 1
          fi
          curl -fL "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz" -o obsutil.tar.gz
          gzip -t obsutil.tar.gz || { echo "obsutil.tar.gz is not a valid gzip"; exit 1; }
          tar xzf obsutil.tar.gz
          rm -f obsutil.tar.gz
          mv obsutil_linux_* obsutil

          obsutil/obsutil config -i="${AK}" -k="${SK}" -e=https://obs.cn-north-4.myhuaweicloud.com
          # obsutil cp takes exactly one source and one destination, so a
          # multi-file glob must be uploaded one wheel at a time.
          # -f: overwrite without prompting; -u: skip unchanged objects.
          for f in wheelhouse/*.whl; do
            obsutil/obsutil cp -f -u "$f" "${OBS_DIR}"
          done

          # Regenerate index.html from every .whl currently in the directory
          # (non-recursive, short format), keeping only the basenames.
          obsutil/obsutil ls "${OBS_DIR}" -d -s -limit=0 \
            | grep -oE '[^/]+\.whl$' \
            | sort -u > files.txt
          while IFS= read -r f; do
            printf "<a href='%s'>%s</a><br />\n" "$f" "$f"
          done < files.txt > index.html
          obsutil/obsutil cp index.html "${OBS_DIR}"

  Upload-Npuir:
    name: Extract and upload npuir payload
    # Opt-in via the upload_npuir boolean input. format() renders the input as
    # 'true'/'false' on dispatch ('' if the workflow is ever triggered without
    # inputs — treated as false). Runs independently of Upload-Wheels: both
    # jobs download the same wheel_urls, but keeping them self-contained avoids
    # passing multi-hundred-MB wheels through artifacts.
    if: format('{0}', github.event.inputs.upload_npuir) == 'true'
    runs-on: linux-amd64-cpu-8
    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      - name: Download wheels
        shell: bash
        env:
          WHEEL_URLS: ${{ github.event.inputs.wheel_urls }}
        run: |
          set -eu
          mkdir -p wheelhouse
          # Accept URLs separated by newlines, spaces, or a mix of both
          # (workflow_dispatch multi-line input may arrive as one line).
          mapfile -t urls < <(tr -s '[:space:]' '\n' <<< "$WHEEL_URLS" | grep -v '^$' || true)
          for url in "${urls[@]}"; do
            case "$url" in
              https://*) ;;
              *) echo "Only https:// URLs are allowed: $url"; exit 1 ;;
            esac
            fname="$(basename "${url%%\?*}")"
            # Wheel filenames percent-encode '+' (local version separator).
            fname="${fname//%2B/+}"
            case "$fname" in
              *.whl) ;;
              *) echo "Not a .whl file: $fname"; exit 1 ;;
            esac
            echo "Downloading $url -> wheelhouse/$fname"
            curl -fL --retry 3 --retry-delay 5 "$url" -o "wheelhouse/$fname"
            # Sanity check: a wheel is a zip archive.
            head -c 2 "wheelhouse/$fname" | grep -q 'PK' \
              || { echo "Downloaded file is not a valid zip/wheel: $fname"; exit 1; }
          done
          [ "${#urls[@]}" -gt 0 ] || { echo "No URLs provided."; exit 1; }
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          [ "${#wheels[@]}" -gt 0 ] || { echo "No wheels downloaded."; exit 1; }
          echo "Downloaded ${#wheels[@]} wheel(s):"
          ls -l "${wheels[@]}"

      - name: Extract npuir payload and pack tarballs
        shell: bash
        env:
          NPUIR_VERSION: ${{ github.event.inputs.npuir_version }}
          NPUIR_TAG: ${{ github.event.inputs.npuir_tag }}
        run: |
          set -eu
          # Each triton_ascend wheel bundles the AscendNPU-IR (bishengir)
          # payload under triton/backends/ascend/bishengir/. This step pulls
          # that payload back out and packs one tarball per architecture,
          # following the naming and layout of npuir-build.yml's publish job:
          #   ascendnpu-ir_<version>_linux-<arch>[-<tag>].tar.gz
          # with bin/, lib/, manifest.xml at the archive root (the same shape
          # the official .run installer unpacks into
          # /usr/local/bisheng/tools/bishengir/).
          printf '%s' "$NPUIR_VERSION" | grep -qE '^[0-9][0-9A-Za-z.+_]*$' \
            || { echo "Invalid npuir_version '$NPUIR_VERSION' (e.g. 2.0.0)."; exit 1; }
          # The tag is optional; only validate it when non-empty (printf '%s'
          # of an empty string gives grep no line at all, which fails even a
          # *$ pattern).
          if [ -n "$NPUIR_TAG" ]; then
            printf '%s\n' "$NPUIR_TAG" | grep -qE '^[0-9A-Za-z._-]*$' \
              || { echo "Invalid npuir_tag '$NPUIR_TAG' (letters, digits, . _ - only)."; exit 1; }
          fi
          command -v python3 >/dev/null || { echo "python3 is required on the runner."; exit 1; }

          cat > extract_npuir.py <<'PYEOF'
          import os, shutil, sys, zipfile

          WHEELHOUSE = "wheelhouse"
          PROBE = "bin/bishengir-compile"

          def arch_name(platform_field):
              # Official release naming: x86_64 payloads are "linux-x86".
              if "aarch64" in platform_field:
                  return "aarch64"
              if "x86_64" in platform_field:
                  return "x86"
              return None

          picked = {}   # arch -> wheel filename (first one wins)
          skipped = []  # (filename, reason)
          for fname in sorted(os.listdir(WHEELHOUSE)):
              if not fname.endswith(".whl"):
                  continue
              parts = fname[:-4].split("-")
              if len(parts) < 5:
                  sys.exit(f"{fname}: not a valid wheel filename")
              arch = arch_name(parts[-1])
              if arch is None:
                  skipped.append((fname, "unrecognized linux platform"))
                  continue
              if arch in picked:
                  # The payload is python-version independent; one wheel per
                  # arch is enough.
                  print(f"note: {fname} ignored — {arch} payload already taken from {picked[arch]}")
                  continue
              picked[arch] = fname

          if not picked:
              sys.exit("no wheel with a recognized linux platform found in wheelhouse")

          extracted = []
          for arch, fname in sorted(picked.items()):
              src = os.path.join(WHEELHOUSE, fname)
              with zipfile.ZipFile(src) as z:
                  probe = [n for n in z.namelist() if n.endswith("/bishengir/" + PROBE)]
                  if not probe:
                      skipped.append((fname, "no bundled bishengir payload"))
                      continue
                  prefix = probe[0][: -len(PROBE)]
                  out_root = f"npuir-{arch}"
                  count = 0
                  for info in z.infolist():
                      name = info.filename
                      if not name.startswith(prefix) or name.endswith("/"):
                          continue
                      rel = name[len(prefix):]
                      if rel.startswith("/") or ".." in rel.split("/"):
                          sys.exit(f"{fname}: unsafe path inside wheel: {name}")
                      dest = os.path.join(out_root, rel)
                      parent = os.path.dirname(dest)
                      if parent:
                          os.makedirs(parent, exist_ok=True)
                      with z.open(info) as fsrc, open(dest, "wb") as fdst:
                          shutil.copyfileobj(fsrc, fdst)
                      # Restore the unix mode stored in the zip (wheels keep
                      # 0o755 on bin/ and the .so files).
                      mode = (info.external_attr >> 16) & 0o7777
                      os.chmod(dest, mode if mode else 0o644)
                      count += 1
              if not os.path.isfile(os.path.join(out_root, PROBE)):
                  sys.exit(f"{fname}: payload extracted but {PROBE} is missing")
              # Free disk early — this job needs nothing else from the wheel.
              os.remove(src)
              extracted.append(arch)
              print(f"extracted {count} file(s) from {fname} -> {out_root}/")

          for fname, why in skipped:
              print(f"warning: skipped {fname} ({why})")
          if not extracted:
              sys.exit("no npuir payload extracted from any wheel")
          print(f"payloads ready for: {', '.join(sorted(extracted))}")
          PYEOF

          python3 extract_npuir.py

          # Safety net mirroring npuir-build.yml: artifact/zip round-trips can
          # drop permission bits, and bin/ must be executable.
          chmod -R a+x npuir-*/bin

          mkdir -p dist
          for d in npuir-*/; do
            arch="${d#npuir-}"
            arch="${arch%/}"
            NAME="ascendnpu-ir_${NPUIR_VERSION}_linux-${arch}"
            if [ -n "$NPUIR_TAG" ]; then
              NAME="${NAME}-${NPUIR_TAG}"
            fi
            tar czf "dist/${NAME}.tar.gz" -C "$d" .
            echo "packed dist/${NAME}.tar.gz"
          done
          ls -l dist/
          sha256sum dist/*.tar.gz

      - name: Setup obsutil and upload npuir tarballs
        shell: bash
        env:
          AK: ${{ secrets.OBS_AK }}
          SK: ${{ secrets.OBS_SK }}
          OVERWRITE: ${{ format('{0}', github.event.inputs.npuir_overwrite) }}
        run: |
          set -eu
          if [ -z "${AK}" ] || [ -z "${SK}" ]; then
            echo "OBS credentials are empty."
            exit 1
          fi
          curl -fL "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz" -o obsutil.tar.gz
          gzip -t obsutil.tar.gz || { echo "obsutil.tar.gz is not a valid gzip"; exit 1; }
          tar xzf obsutil.tar.gz
          rm -f obsutil.tar.gz
          mv obsutil_linux_* obsutil

          # Same bucket/directory integration-tests-ascend.yml reads the
          # Bisheng compiler from; public base URL:
          # https://triton-ascend-artifacts.obs.cn-southwest-2.myhuaweicloud.com/cann/
          obsutil/obsutil config -i="${AK}" -k="${SK}" -e=https://obs.cn-southwest-2.myhuaweicloud.com
          OBS_DIR="obs://triton-ascend-artifacts/cann/"
          for f in dist/*.tar.gz; do
            base="$(basename "$f")"
            # Guard: never silently replace an existing object unless the
            # dispatch explicitly asked for it (same policy as npuir-build.yml).
            if [ "${OVERWRITE}" != "true" ] && obsutil/obsutil stat "${OBS_DIR}${base}" >/dev/null 2>&1; then
              echo "Object cann/${base} already exists on OBS; re-dispatch with npuir_overwrite=true to replace it."
              exit 1
            fi
            # -f without -u: when npuir_overwrite=true the whole point is to
            # replace a same-name object whose content changed.
            obsutil/obsutil cp -f "$f" "${OBS_DIR}"
          done
          echo "Published to ${OBS_DIR}:"
          sha256sum dist/*.tar.gz
          echo "Pin the filename + sha256 in cmake/bisheng-version.txt to make"
          echo "integration-tests-ascend.yml install this payload instead of the .run."
