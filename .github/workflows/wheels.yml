name: Wheels

on:
  workflow_dispatch:
  push:
    branches: [release/**]
  pull_request:
    paths:
      - .github/workflows/wheels.yml
      - .github/workflows/build/wheels.Dockerfile
      - setup.py
      - pyproject.toml
      - version.txt
      - cmake/llvm-hash.txt
      - cmake/json-version.txt
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:

  Build-Wheels:
    name: Build wheels for ${{ matrix.config.arch }}-${{ matrix.python }}-${{ matrix.branch.tag }}
    runs-on: ${{ matrix.config.runs_on }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
      # PYTHON must live under container.env (not job env) so ARC maps it into
      # the job container's pod-spec env, where the runner pod's postStart hook
      # (buildkitd node pinning) can read it. Same pattern as vllm-ascend's SOC.
      env:
        PYTHON: ${{matrix.python}}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Limit parallelism: wheel builds compile hundreds of C++ files on
      # memory-constrained workers; too many at once causes OOM kills and
      # buildkitd/SWR auth timeouts.
      max-parallel: 8
      matrix:
        config:
        - {runs_on: 'linux-amd64-cpu-4', arch: 'x86_64'}
        - {runs_on: 'linux-aarch64-cpu-4', arch: 'aarch64'}
        python: ["cp310", "cp311", "cp312", "cp313"]
        branch:
        # npuir: ON builds the BishengIR payload in-image via build_npuir.py
        # (requires the TRITON_BUILD_NPUIR handling in third_party/ascend/build
        # on that branch); OFF uses the prebuilt payload from npuir-build.yml.
        - {ref: 'main', tag: 'main', local: 'dev', npuir: 'OFF'}
        # - {ref: 'release/3.2.2', tag: 'release-3.2.2', local: 'release', npuir: 'OFF'}

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Check for new commits
        if: github.event_name == 'push'
        id: new-commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_SHA=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/wheels.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ "$LAST_SHA" = "${{ github.sha }}" ]; then
            echo "Current commit already has a successful wheel build. Skipping."
            echo "has_new_commits=false" >> $GITHUB_OUTPUT
          else
            echo "New commits detected. Proceeding with wheel build."
            echo "has_new_commits=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # PR: checkout the PR head, not the matrix.branch ref (main).
          # push/workflow_dispatch/schedule: use the matrix branch ref.
          ref: ${{ github.event_name != 'pull_request' && matrix.branch.ref || '' }}

      - name: Restore npuir payload from local cache
        id: npuir-cache
        if: (github.event_name != 'push' || steps.new-commits.outputs.has_new_commits != 'false') && matrix.branch.npuir == 'OFF'
        env:
          NPUIR_CACHE_KEY: ${{ matrix.config.arch }}-npuir-${{ hashFiles('cmake/llvm-hash.txt', 'cmake/json-version.txt') }}
        shell: bash
        run: |
          set -eu
          # The shared-volume PVC (/root/.cache) persists across runner pods;
          # cache the payload there (keyed by the npuir pin) to skip the slow
          # artifact download on subsequent runs.
          CACHE_DIR="/root/.cache/npuir-payload/${NPUIR_CACHE_KEY}"
          if [ -x "${CACHE_DIR}/bin/bishengir-compile" ]; then
            echo "npuir payload cache hit: ${CACHE_DIR}"
            rm -rf .npuir-payload
            mkdir -p .npuir-payload
            cp -a "${CACHE_DIR}/bin" .npuir-payload/
            cp -a "${CACHE_DIR}/lib" .npuir-payload/
            chmod -R a+x .npuir-payload/bin
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "npuir payload cache miss (key=${NPUIR_CACHE_KEY})"
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download npuir payload from PR build
        id: payload-pr
        if: (github.event_name != 'push' || steps.new-commits.outputs.has_new_commits != 'false') && matrix.branch.npuir == 'OFF' && steps.npuir-cache.outputs.cache_hit != 'true'
        # Pull this PR's npuir-build artifact first (pre-merge testing); for
        # fork PRs the run lives on the fork, so allow_forks is required.
        # push/schedule use the matrix branch's payload.
        uses: dawidd6/action-download-artifact@v9
        continue-on-error: true
        with:
          workflow: npuir-build.yml
          workflow_conclusion: success
          allow_forks: true
          branch: ${{ github.event_name == 'pull_request' && github.head_ref || matrix.branch.ref }}
          name: npuir-payload-manylinux-${{ matrix.config.arch }}
          path: npuir-artifacts

      - name: Prepare npuir payload
        id: prepare-payload
        if: (github.event_name != 'push' || steps.new-commits.outputs.has_new_commits != 'false') && matrix.branch.npuir == 'OFF'
        env:
          NPUIR_CACHE_KEY: ${{ matrix.config.arch }}-npuir-${{ hashFiles('cmake/llvm-hash.txt', 'cmake/json-version.txt') }}
        shell: bash
        run: |
          set -eu
          # Cache hit already populated .npuir-payload in the restore step.
          if [ "${{ steps.npuir-cache.outputs.cache_hit }}" = "true" ]; then
            echo "Using locally cached npuir payload."
            echo "build_npuir=OFF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Bundled into the wheel via TRITON_ASCEND_BISHENGIR_PATH in
          # wheels.Dockerfile. Sourced from the npuir-build GitHub artifact
          # downloaded above; when it is missing (fresh branch, expired
          # artifact) fall back to compiling the payload in-image so the build
          # still produces a correct wheel instead of failing.
          BIN=$(find npuir-artifacts -name bishengir-compile -type f 2>/dev/null | head -1 || true)
          if [ -z "${BIN}" ]; then
            echo "No npuir-payload artifact for ${{ matrix.config.arch }}; falling back to in-image build (slow)."
            echo "build_npuir=ON" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PAYLOAD_DIR=$(dirname "$(dirname "${BIN}")")
          echo "Using npuir-build payload at ${PAYLOAD_DIR}"
          rm -rf .npuir-payload
          mkdir -p .npuir-payload
          cp -a "${PAYLOAD_DIR}/bin" .npuir-payload/
          cp -a "${PAYLOAD_DIR}/lib" .npuir-payload/
          # GitHub artifact zips carry no unix permission bits (upload-artifact
          # zips without setUnixMode) and action-download-artifact extracts
          # via adm-zip as 0644, so restore the exec bit explicitly.
          chmod -R a+x .npuir-payload/bin
          # Save to the shared-volume PVC so the next run skips the download.
          CACHE_DIR="/root/.cache/npuir-payload/${NPUIR_CACHE_KEY}"
          rm -rf "${CACHE_DIR}"
          mkdir -p "${CACHE_DIR}"
          cp -a .npuir-payload/bin "${CACHE_DIR}/"
          cp -a .npuir-payload/lib "${CACHE_DIR}/"
          chmod -R a+x "${CACHE_DIR}/bin"
          echo "Saved npuir payload to local cache ${CACHE_DIR}"
          ls -la .npuir-payload/bin
          echo "build_npuir=OFF" >> "$GITHUB_OUTPUT"

      - name: Compute build variables
        id: vars
        shell: bash
        run: |
          # Parallelism is decided inside the Docker build (the job pod's
          # cgroup here is tiny and unrelated to the shared buildkitd the
          # compile actually runs on; see wheels.Dockerfile).
          BUILD_DATE=$(date -u +%Y%m%d)
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build wheels
        if: github.event_name != 'push' || steps.new-commits.outputs.has_new_commits != 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/workflows/build/wheels.Dockerfile
          build-args: |
            MANYLINUX_IMAGE=swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/manylinux:9.2.0-beta.2-a3-manylinux_2_34-py3.12
            PYTHON_VERSION=${{ matrix.python }}
            TRITON_BUILD_NPUIR=${{ steps.prepare-payload.outputs.build_npuir || matrix.branch.npuir }}
            TRITON_WHEEL_VERSION_SUFFIX=+${{ matrix.branch.local }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
          # Same registry-cache pattern as build-docker-image.yml: the dnf and
          # pip layers of wheels.Dockerfile (kept before the COPY of the
          # workspace) hit the cache across runs; the source-dependent wheel
          # build layer still rebuilds, but skips the dependency setup.
          # cache-from only (no cache-to): the cache is warmed from a single
          # cache-to run and then read-only, avoiding the expensive mode=max
          # export on every build.
          cache-from: type=registry,ref=swr.cn-north-12.myhuaweicloud.com/modelfoundry/triton-wheel-buildcache:${{ matrix.config.arch }}
          outputs: type=local,dest=./wheelhouse

      - uses: actions/upload-artifact@v4
        # GitHub artifacts are only a PR review convenience (manual wheel
        # download). push/schedule already publish to OBS, and nothing else
        # consumes these artifacts, so skip the slow upload outside PRs.
        if: github.event_name == 'pull_request'
        with:
          name: cibw-wheels-manylinux_2_34_${{ matrix.config.arch }}-${{ matrix.python }}-${{ matrix.branch.tag }}-wheels-upload
          path: ./wheelhouse/*.whl
          # Wheels are already zip-compressed; skip the re-compress pass.
          compression-level: 0

      - name: Setup obsutil and upload to OBS
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || steps.new-commits.outputs.has_new_commits != 'false')
        shell: bash
        env:
          AK: ${{ secrets.NIGHTLY_OBS_AK }}
          SK: ${{ secrets.NIGHTLY_OBS_SK }}
          ARCH: ${{ matrix.config.arch == 'x86_64' && 'amd64' || 'arm64' }}
        run: |
          set -eu
          if [ -z "${AK}" ] || [ -z "${SK}" ]; then
            echo "OBS credentials are empty."
            exit 1
          fi
          curl -fL "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_${ARCH}.tar.gz" -o obsutil.tar.gz
          gzip -t obsutil.tar.gz || { echo "obsutil.tar.gz is not a valid gzip"; exit 1; }
          tar xzf obsutil.tar.gz
          rm -f obsutil.tar.gz
          mv obsutil_linux_* obsutil

          obsutil/obsutil config -i="${AK}" -k="${SK}" -e=https://obs.cn-north-4.myhuaweicloud.com
          OBS_DIR="obs://ascend-artifcat-packages/pypi/packages/ascend/repos/pypi/nightly/triton-ascend/"
          obsutil/obsutil cp -u wheelhouse/*.whl "${OBS_DIR}"

          # Regenerate index.html from every .whl currently in the directory
          # (non-recursive, short format), keeping only the basenames.
          obsutil/obsutil ls "${OBS_DIR}" -d -s -limit=0 \
            | grep -oE '[^/]+\.whl$' \
            | sort -u > files.txt
          while IFS= read -r f; do
            printf "<a href='%s'>%s</a><br />\n" "$f" "$f"
          done < files.txt > index.html
          obsutil/obsutil cp index.html "${OBS_DIR}"
