# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/zh/conf.py

python:
  install:
  - requirements: docs/zh/requirement.txt

submodules:
  include: all

versions:
  - name: latest
    label: latest (main)
    type: branch
    branch: main
    pinned: true
  - name: "3.2.2"
    label: "3.2.2"
    type: tag
    tag: 3.2.2
    pinned: false
