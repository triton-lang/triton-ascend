<svg xmlns="http://www.w3.org/2000/svg" width="820" height="156" viewBox="0 0 820 156" role="img" aria-labelledby="title desc">
  <title id="title">Writing the new accumulator before and after forwarding</title>
  <desc id="desc">Before   VF reads 10 and PV → writes 8 to the PV buffer → copies 8 back to Oacc
After    VF reads 10 and PV → writes 8 directly to Oacc</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#536675" />
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="156" rx="6" fill="#ffffff" />
  <rect x="4" y="8" width="812" height="66" rx="6" fill="#f2f7f9" />
  <text x="53.5" y="46.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Before</text>
  <rect x="123" y="16" width="197" height="50" rx="5" fill="#e3eff8" stroke="#c7d6df" />
  <text x="221.5" y="46.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">VF reads 10 and PV</text>
  <rect x="348" y="16" width="217" height="50" rx="5" fill="#fff1ce" stroke="#c7d6df" />
  <text x="456.5" y="46.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">writes 8 to the PV buffer</text>
  <polyline points="322,41 345,41" fill="none" stroke="#536675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="593" y="16" width="215" height="50" rx="5" fill="#e3eff8" stroke="#c7d6df" />
  <text x="700.5" y="46.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">copies 8 back to Oacc</text>
  <polyline points="567,41 590,41" fill="none" stroke="#536675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="4" y="78" width="812" height="66" rx="6" fill="#f2f7f9" />
  <text x="53.5" y="116.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">After</text>
  <rect x="123" y="86" width="197" height="50" rx="5" fill="#e0f1ec" stroke="#c7d6df" />
  <text x="221.5" y="116.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">VF reads 10 and PV</text>
  <rect x="593" y="86" width="215" height="50" rx="5" fill="#e0f1ec" stroke="#c7d6df" />
  <text x="700.5" y="116.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">writes 8 directly to Oacc</text>
  <polyline points="322,111 590,111" fill="none" stroke="#536675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
</svg>
