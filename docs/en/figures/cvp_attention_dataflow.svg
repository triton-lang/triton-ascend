<svg xmlns="http://www.w3.org/2000/svg" width="960" height="254" viewBox="0 0 960 254" role="img" aria-labelledby="title desc">
  <title id="title">Flash Attention dataflow for one key tile</title>
  <desc id="desc">Cube · Q × Kᵀ → Vector · scale, max, exp. Vector · scale, max, exp → Update FP32 row sum. Vector · scale, max, exp → Cast P to FP16. Cast P to FP16 → Cube · P × V. Vector · scale, max, exp → Rescale factor. Rescale factor → Update FP32 row sum. Rescale factor → Vector · update accumulator. Cube · P × V → Vector · update accumulator. Vector · update accumulator → Final tile · normalize O. Update FP32 row sum → Final tile · normalize O.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#536675" />
    </marker>
  </defs>
