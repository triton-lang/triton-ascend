  <text x="254.5" y="77.1" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Q0 tile 3 → sum[0], max[0]</text>
  <rect x="403" y="51" width="394" height="42" rx="4" fill="#e0f1ec" />
  <text x="600.0" y="77.1" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Update Q0 tile 1</text>
