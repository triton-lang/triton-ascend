  <text x="254.5" y="122.1" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Q1 tile 0 → sum[1], max[1]</text>
  <rect x="403" y="96" width="394" height="42" rx="4" fill="#e0f1ec" />
  <text x="600.0" y="122.1" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Update Q0 tile 2</text>
