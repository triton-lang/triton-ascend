<svg xmlns="http://www.w3.org/2000/svg" width="807" height="196" viewBox="0 0 807 196" role="img" aria-labelledby="title desc">
  <title id="title">P stage and output stage using the query slots at iterations 4, 5 and 6</title>
  <desc id="desc">Iteration   P stage writes                          Output stage
4           Q0 tile 3 → sum[0], max[0]              Update Q0 tile 1
5           Q1 tile 0 → sum[1], max[1]              Update Q0 tile 2
6           Q1 tile 1 → sum[1], max[1]              Finish Q0 tile 3 using sum[0], max[0]</desc>
