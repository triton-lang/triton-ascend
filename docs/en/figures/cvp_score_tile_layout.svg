<svg xmlns="http://www.w3.org/2000/svg" width="860" height="267" viewBox="0 0 860 267" role="img" aria-labelledby="title desc">
  <title id="title">Query-major and key-major layouts of the same score tile</title>
  <desc id="desc">Query-major · Q @ Kᵀ                    Key-major · K @ Qᵀ
Reduce across each row →                Reduce down each lane ↓

       K0   K1   K2    max                     Q0      Q1
 Q0     1    2    3  →   3                   lane 0  lane 1
 Q1    10   20   30  →  30               K0      1      10   ← first Vector read
                                         K1      2      20
                                         K2      3      30
                                                 ↓       ↓
                                        max      3      30</desc>
