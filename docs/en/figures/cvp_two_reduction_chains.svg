<svg xmlns="http://www.w3.org/2000/svg" width="880" height="234" viewBox="0 0 880 234" role="img" aria-labelledby="title desc">
  <title id="title">One chain and two chains for a row sum</title>
  <desc id="desc">One chain                                  Two chains
0.5 + 0.25 → 0.75                          A: 0.5 + 0.25 → 0.75 ─┐
             0.75 + 1 → 1.75               B: 1   + 0.25 → 1.25 ─┴─ add → 2
                        1.75 + 0.25 → 2</desc>
