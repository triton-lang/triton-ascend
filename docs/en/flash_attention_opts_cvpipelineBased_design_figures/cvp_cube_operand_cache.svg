  <rect x="473" y="141" width="365" height="42" rx="4" fill="#e0f1ec" />
  <text x="655.5" y="167.1" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Reuse Q0 in L0B → QK(Q0,K2)</text>
