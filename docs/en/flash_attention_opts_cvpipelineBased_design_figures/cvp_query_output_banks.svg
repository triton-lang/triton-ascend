<svg xmlns="http://www.w3.org/2000/svg" width="742" height="296" viewBox="0 0 742 296" role="img" aria-labelledby="title desc">
  <title id="title">Even and odd UB pairs store each query’s output rows in GM</title>
  <desc id="desc">Q0 finishes → UB pair 0 → store to Q0’s rows of O and M in GM
Q1 finishes → UB pair 1 → store to Q1’s rows of O and M in GM
Q2 finishes → UB pair 0 → store to Q2’s rows of O and M in GM
Q3 finishes → UB pair 1 → store to Q3’s rows of O and M in GM</desc>
