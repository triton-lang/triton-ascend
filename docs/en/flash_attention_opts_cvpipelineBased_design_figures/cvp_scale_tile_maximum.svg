<svg xmlns="http://www.w3.org/2000/svg" width="862" height="194" viewBox="0 0 862 194" role="img" aria-labelledby="title desc">
  <title id="title">Scaling every score and scaling the tile maximum</title>
  <desc id="desc">Scale every score, then find the max       Find the max, then scale it
[2, 6, 4] × 0.5 → [1, 3, 2]               max([2, 6, 4]) → 6
max([1, 3, 2])  → 3                         6 × 0.5         → 3</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#536675" />
    </marker>
  </defs>
  <rect x="0" y="0" width="862" height="194" rx="6" fill="#ffffff" />
  <rect x="8" y="8" width="419.0" height="178" rx="8" fill="#f2f7f9" />
  <rect x="8" y="18" width="4" height="27" rx="2" fill="#20568a" />
  <text x="21" y="38" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start">Scale every score, then find the max</text>
  <rect x="435.0" y="8" width="419.0" height="178" rx="8" fill="#f2f7f9" />
  <rect x="435.0" y="18" width="4" height="27" rx="2" fill="#166656" />
  <text x="448.0" y="38" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start">Find the max, then scale it</text>
  <rect x="27" y="57" width="375" height="42" rx="5" fill="#e3eff8" stroke="#c7d6df" />
  <text x="214.5" y="84.12" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle">[2, 6, 4] × 0.5 → [1, 3, 2]</text>
  <polyline points="214,100 214,120" fill="none" stroke="#536675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="27" y="123" width="375" height="42" rx="5" fill="#e3eff8" stroke="#c7d6df" />
  <text x="214.5" y="150.12" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">max([1, 3, 2]) → 3</text>
  <rect x="457" y="57" width="375" height="42" rx="5" fill="#e0f1ec" stroke="#c7d6df" />
  <text x="644.5" y="84.12" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle">max([2, 6, 4]) → 6</text>
  <polyline points="644,100 644,120" fill="none" stroke="#536675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="457" y="123" width="375" height="42" rx="5" fill="#e0f1ec" stroke="#c7d6df" />
  <text x="644.5" y="150.12" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">6 × 0.5 → 3</text>
</svg>
