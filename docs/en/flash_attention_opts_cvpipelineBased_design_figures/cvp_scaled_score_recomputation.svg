  <rect x="464.0" y="18" width="4" height="27" rx="2" fill="#166656" />
  <text x="477.0" y="38" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start">Recompute at each use</text>
