  <polyline points="222,84 242,84" fill="none" stroke="#536675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="244" y="63" width="183" height="42" rx="5" fill="#fff1ce" stroke="#c7d6df" />
  <text x="335.5" y="89.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">write [1, 3, 2]</text>
  <polyline points="335,105 335,125 118,125 118,143" fill="none" stroke="#536675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <polyline points="335,105 335,143" fill="none" stroke="#536675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="25" y="145" width="186" height="48" rx="5" fill="#e3eff8" stroke="#c7d6df" />
  <text x="118.0" y="174.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">read → row maximum</text>
  <rect x="223" y="145" width="213" height="48" rx="5" fill="#e3eff8" stroke="#c7d6df" />
  <text x="329.5" y="164.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">read → subtract max,</text>
  <text x="329.5" y="184.44" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">exp</text>
