  <text x="757.0" y="89.94" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">× 0.5 → row maximum</text>
  <polyline points="579,125 602,125 602,169 625,169" fill="none" stroke="#536675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
