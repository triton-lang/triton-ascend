<svg xmlns="http://www.w3.org/2000/svg" width="920" height="225" viewBox="0 0 920 225" role="img" aria-labelledby="title desc">
  <title id="title">Storing the scaled tile in UB or recomputing it at each use</title>
  <desc id="desc">Store the scaled tile in UB                Recompute at each use
[2, 6, 4] × 0.5 → write [1, 3, 2]          raw QK ─┬─ × 0.5 → row maximum
                   ├─ read → row maximum           └─ × 0.5 → subtract max, exp
                   └─ read → subtract max, exp</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#536675" />
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="225" rx="6" fill="#ffffff" />
  <rect x="8" y="8" width="448.0" height="209" rx="8" fill="#f2f7f9" />
  <rect x="8" y="18" width="4" height="27" rx="2" fill="#20568a" />
  <text x="21" y="38" fill="#172f43" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start">Store the scaled tile in UB</text>
