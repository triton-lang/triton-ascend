<svg xmlns="http://www.w3.org/2000/svg" width="900" height="222" viewBox="0 0 900 222" role="img" aria-labelledby="title desc">
  <title id="title">Subtracting each query maximum in the two score layouts</title>
  <desc id="desc">Query-major · lanes hold different keys     Key-major · lanes hold different queries
Q0: [ 1,  2,  3] - [ 3,  3,  3]            K0: [1, 10] - [3, 30]
Q1: [10, 20, 30] - [30, 30, 30]            K1: [2, 20] - [3, 30]
                    ↑ broadcast            K2: [3, 30] - [3, 30]
                                                          ↑ same maxima vector</desc>
